<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あなたの軌跡 ポイント</title>
  <link rel="icon" href="icon.png">
  <style>
    /* 色は、アプリ(lib/common/constants/app_colors.dart)と同じ値 */
    :root {
      --navy: #3F5879;
      --navy-dark: #2E4260;
      --pink: #FFE4E1;
      --page: #FFF7F5;
      --white: #FFFFFF;
      --orange: #E06A2E;
      --orange-dark: #C75A22;
      --text: #1F2430;
      --text-sub: #5E6472;
      --line: #F0DAD5;
      --disabled-fill: #EFE3E0;
      --disabled-content: #9A9FA9;
      --shadow: 0 1px 2px rgba(46, 66, 96, .06), 0 4px 12px rgba(46, 66, 96, .05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--page); color: var(--text);
      font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
      font-size: 15px; line-height: 1.7;
    }
    header {
      background: var(--navy); color: var(--white); height: 56px;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
    }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    header .name { font-weight: 700; letter-spacing: .04em; }
    header .sub { font-weight: 400; opacity: .85; margin-left: 4px; }
    main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 24px; margin: 4px 0 0; line-height: 1.3; }
    h2 { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--text-sub);
         margin: 24px 4px 8px; }
    p { margin: 0; }
    .login { color: var(--text-sub); font-size: 13px; margin: 0 0 12px; }
    .card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
    .card + .card { margin-top: 12px; }

    /* ボタン */
    button { font: inherit; cursor: pointer; }
    .primary, .secondary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 52px; border-radius: 999px; font-weight: 700; font-size: 16px;
    }
    .primary { background: var(--orange-dark); color: var(--white); border: 0;
               box-shadow: 0 4px 12px rgba(199, 90, 34, .28); }
    .primary:disabled { background: var(--disabled-fill); color: var(--disabled-content);
                        box-shadow: none; cursor: default; }
    .secondary { background: var(--white); color: var(--navy-dark); height: 48px; font-size: 15px;
                 border: 1px solid var(--line); }
    .pill { background: var(--white); color: var(--orange-dark); border: 1px solid var(--line);
            border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 13px; }

    /* ログイン前 */
    .hero { text-align: center; padding: 28px 20px 24px; }
    .hero .circle { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%;
                    background: var(--pink); display: grid; place-items: center; color: var(--navy); }
    .hero h1 { font-size: 22px; }
    .hero p { color: var(--text-sub); margin: 8px 0 20px; }

    /* ポイントとトークン */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .stat { padding: 14px 16px; }
    .stat .label { display: flex; align-items: center; gap: 6px; color: var(--text-sub); font-size: 13px; }
    .stat .value { font-size: 28px; font-weight: 700; color: var(--navy-dark); line-height: 1.3; }
    .stat .unit { font-size: 14px; font-weight: 400; color: var(--text-sub); margin-left: 4px; }

    /* 入力欄 */
    .field { display: flex; align-items: center; gap: 12px; height: 52px; background: var(--white);
             border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
    .field:focus-within { border-color: var(--navy); outline: 1px solid var(--navy); }
    .field input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 16px;
                   font-weight: 700; background: transparent; color: var(--text); }
    .field input::placeholder { color: var(--disabled-content); font-weight: 400; }
    .field .suffix { color: var(--text-sub); font-size: 14px; }
    .hint { text-align: center; color: var(--text-sub); font-size: 13px; margin-top: 8px; }
    .gap { margin-top: 12px; }

    /* 履歴・端末の一覧 */
    .list { list-style: none; margin: 0; padding: 0; background: var(--white);
            border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .list li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
               padding: 12px 16px; border-top: 1px solid var(--line); }
    .list li:first-child { border-top: 0; }
    .rowTitle { font-weight: 700; line-height: 1.5; }
    .rowSub, .historyTime { color: var(--text-sub); font-size: 12px; line-height: 1.5; }
    .historyAmount { white-space: nowrap; text-align: right; font-weight: 700; }
    .historyAmount small { font-weight: 400; font-size: 12px; }
    .plus { color: var(--navy-dark); }
    .minus { color: var(--orange-dark); }
    .empty { color: var(--text-sub); text-align: center; padding: 16px; }
    .more { margin-top: 12px; }

    /* 注意 */
    .notice-box { display: flex; gap: 8px; background: var(--pink); border-radius: 12px;
                  padding: 12px; margin: 12px 0; font-weight: 700; font-size: 13px; line-height: 1.7; }
    .notice-box svg { flex: none; margin-top: 3px; color: var(--orange-dark); }
    .pair { display: flex; gap: 8px; }
    .pair .field { flex: 1; }
    .pair .primary { width: auto; height: 52px; padding: 0 20px; font-size: 15px; }
    .deviceHead { font-size: 13px; color: var(--text-sub); padding: 12px 16px 4px; background: var(--white);
                  border-radius: 16px 16px 0 0; margin-top: 12px; box-shadow: var(--shadow); }
    .deviceHead + .list { border-radius: 0 0 16px 16px; box-shadow: var(--shadow); }

    #message { color: #B4442B; margin: 16px 4px 0; }
    #notice { color: var(--navy-dark); margin: 16px 4px 0; }
    #message:empty, #notice:empty { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icon.png" alt="">
    <span class="name">あなたの軌跡<span class="sub">ポイント</span></span>
  </header>

  <main>
    <div id="signedOut" hidden>
      <div class="card hero">
        <div class="circle" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/>
            <path d="M10 7v10M10 7h3.2a2.6 2.6 0 0 1 0 5.2H10M8 14h6"/></svg>
        </div>
        <h1>ポイント</h1>
        <p>ポイントを使うには、アカウントが必要です。</p>
        <button id="loginButton" class="primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/>
            <path d="M11 12l9-9M16 7l3 3"/></svg>
          ログイン / アカウント作成
        </button>
      </div>
    </div>

    <div id="signedIn" hidden>
      <h1>ポイント</h1>
      <p class="login">ログイン中: <span id="email"></span></p>

      <div class="stats">
        <div class="card stat">
          <div class="label">ポイント</div>
          <div class="value"><span id="points">-</span><span class="unit">pt</span></div>
        </div>
        <div class="card stat">
          <div class="label">トークン</div>
          <div class="value"><span id="tokens">-</span></div>
        </div>
      </div>

      <h2>トークンに交換</h2>
      <div class="card">
        <p id="exchangeRule"></p>
        <div class="field gap">
          <input id="exchangePoints" type="number" min="1" step="1" inputmode="numeric">
          <span class="suffix">ポイント</span>
        </div>
        <button id="exchangeButton" class="primary gap">トークンに交換</button>
        <p id="exchangeHint" class="hint" hidden></p>
      </div>

      <h2>ポイントの履歴</h2>
      <p id="historyEmpty" class="card empty" hidden>まだ履歴がありません。</p>
      <ul id="historyList" class="list"></ul>
      <button id="historyMoreButton" class="secondary more" hidden>もっと見る</button>

      <h2>アプリを紐づける</h2>
      <div class="card">
        <p>
          日記アプリやゲームアプリの画面に表示された6桁のコードを入力してください。
          同じアプリには、3台まで紐づけられます。
        </p>
        <div class="notice-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/></svg>
          <span>ご自身のアプリに表示されたコード以外は、入力しないでください。</span>
        </div>
        <div class="pair">
          <div class="field">
            <input id="pairingCode" type="text" inputmode="numeric" maxlength="6"
                   pattern="[0-9]{6}" placeholder="6桁のコード" autocomplete="off">
          </div>
          <button id="pairingButton" class="primary">紐づける</button>
        </div>
      </div>

      <div class="deviceHead">紐づけ済み(<span id="deviceCount">0</span>件)</div>
      <ul id="deviceList" class="list"></ul>

      <h2>テスト用(公開前に無効にする)</h2>
      <div class="card">
        <button id="grantButton" class="secondary">ポイントを10,000追加</button>
      </div>

      <button id="logoutButton" class="secondary gap">ログアウト</button>
    </div>

    <p id="message"></p>
    <p id="notice"></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
