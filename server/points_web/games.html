<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲーム | あなたの軌跡 ポイント</title>
  <link rel="icon" href="icon.png">
  <style>
    /* 色は、アプリ(lib/common/constants/app_colors.dart)と同じ値 */
    :root {
      --navy: #3F5879; --navy-dark: #2E4260; --pink: #FFE4E1; --page: #FFF7F5; --white: #FFFFFF;
      --orange-dark: #C75A22; --text: #1F2430; --text-sub: #5E6472; --line: #F0DAD5;
      --shadow: 0 1px 2px rgba(46, 66, 96, .06), 0 4px 12px rgba(46, 66, 96, .05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text);
           font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
           font-size: 15px; line-height: 1.7; }
    header { background: var(--navy); color: var(--white); height: 56px;
             display: flex; align-items: center; gap: 12px; padding: 0 16px; }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    header .name { font-weight: 700; letter-spacing: .04em; }
    header .sub { font-weight: 400; opacity: .85; margin-left: 4px; }
    main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 24px; margin: 4px 0 4px; line-height: 1.3; }
    .lead { color: var(--text-sub); margin: 0 0 16px; }
    h3 { font-size: 18px; margin: 0; }
    .card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
    .card + .card { margin-top: 12px; }
    .gameHead { display: flex; align-items: center; gap: 12px; }
    .gameIcon { width: 56px; height: 56px; border-radius: 14px; flex: none; object-fit: cover; }
    .gameIcon.initial { background: var(--pink); color: var(--navy); font-size: 24px; font-weight: 700;
                        display: grid; place-items: center; }
    .gameSummary { margin: 12px 0 0; }
    .gamePoints { margin: 8px 0 0; color: var(--navy-dark); font-weight: 700; font-size: 14px; }
    /* ポイントが貯まるケースを見るボタン(押すと、ダイアログで表を出す) */
    .secondary { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px;
                 margin-top: 16px; border-radius: 999px; background: var(--white); color: var(--navy-dark);
                 border: 1px solid var(--line); font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }

    /* ダイアログ(表が長くなっても、中だけスクロールする) */
    dialog.rulesDialog { border: 0; border-radius: 20px; padding: 0; width: calc(100% - 32px); max-width: 440px;
                         max-height: 80vh; background: var(--white); color: var(--text);
                         box-shadow: 0 8px 32px rgba(46, 66, 96, .25); overflow: hidden; }
    dialog.rulesDialog[open] { display: flex; flex-direction: column; }
    dialog.rulesDialog::backdrop { background: rgba(31, 36, 48, .45); }
    .dialogHead { padding: 20px 20px 8px; }
    .dialogHead h3 { color: var(--navy-dark); line-height: 1.5; }
    .dialogHead p { margin: 2px 0 0; color: var(--text-sub); font-size: 13px; }
    .dialogBody { padding: 0 20px; overflow-y: auto; flex: 1; min-height: 0; outline: 0; }
    .dialogFoot { padding: 12px 20px 20px; }
    .dialogFoot button { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px;
                         border-radius: 999px; border: 0; background: var(--orange-dark); color: var(--white);
                         font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    .rules table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .rules th { text-align: left; color: var(--text-sub); font-weight: 400; font-size: 12px; padding: 4px 0; }
    .rules td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
    .rules .num { text-align: right; white-space: nowrap; font-weight: 700; color: var(--navy-dark);
                  padding-left: 12px; font-variant-numeric: tabular-nums; }
    .rules .limit { color: var(--text-sub); font-size: 12px; padding-left: 12px; }
    .primary { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px;
               margin-top: 16px; border-radius: 999px; background: var(--orange-dark); color: var(--white);
               font-weight: 700; font-size: 16px; text-decoration: none; box-shadow: 0 4px 12px rgba(199, 90, 34, .28); }
    .empty { text-align: center; color: var(--text-sub); }
    .note { color: var(--text-sub); font-size: 13px; margin: 24px 4px 0; }
    .legal { text-align: center; font-size: 13px; margin: 24px 0 0; }
    .legal a { color: var(--text-sub); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icon.png" alt="">
    <span class="name">あなたの軌跡<span class="sub">ポイント</span></span>
  </header>

  <main>
    <h1>ゲーム</h1>
    <p class="lead">ゲームで遊ぶと、ポイントが貯まります。貯めたポイントは、トークンに交換して、日記アプリで使えます。</p>

    <div id="gameList"></div>
    <p id="gameEmpty" class="card empty" hidden>ゲームは、準備中です。</p>

    <p class="note">ポイントを使うには、アカウントを作って、アプリと紐づける必要があります。</p>
    <p class="legal"><a href="privacy.html">プライバシーポリシー</a></p>
  </main>

  <dialog id="rulesDialog" class="rulesDialog" aria-labelledby="rulesTitle">
    <div class="dialogHead">
      <h3 id="rulesTitle"></h3>
      <p>ポイントが貯まるケースと、もらえるポイントです。</p>
    </div>
    <div id="rulesBody" class="dialogBody rules"></div>
    <div class="dialogFoot"><button type="button" id="rulesClose">閉じる</button></div>
  </dialog>

  <script src="config.js"></script>
  <script src="games_data.js"></script>
  <script src="games_page.js"></script>
</body>
</html>
